name: On-Prem CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

# Addressing the deprecation warning from your logs
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Using a stable, modern version
          cache: 'npm'

      - name: Clean and Install
        run: |
          # Clean build artifacts to keep on-prem storage tidy
          rm -rf dist build
          npm ci # 'npm ci' is faster and more reliable for CI/CD than 'npm install'

      - name: Build Project
        run: npm run build --if-present

      - name: Run Tests
        run: npm test --if-present

      # Placeholder for your local deployment
      - name: Local Deploy
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploying school-management to local services..."
          # Add your restart commands here, e.g., pm2 restart all or systemctl restart app
