name: On-Prem CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # This must match the label of your on-prem runner
    runs-on: self-hosted 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Optional: Clean workspace to prevent artifacts from previous runs
      - name: Cleanup Previous Build
        run: |
          echo "Cleaning up workspace..."
          rm -rf ./dist ./build

      - name: Install Dependencies
        run: |
          # Replace with your specific package manager (e.g., pip install, mvn install)
          npm install 

      - name: Run Build
        run: |
          npm run build --if-present

      - name: Run Tests
        run: |
          npm test

      # Example: Local Deployment / Service Restart
      # Since it's on-prem, you can trigger local scripts directly
      - name: Local Deploy
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploying to local environment..."
          # ./scripts/deploy.sh or systemctl restart school-mgmt
